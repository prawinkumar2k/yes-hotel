# PROPOSAL ONLY. Not applied anywhere. Nothing on the server was read or changed to write this.
#
# Goal: one public address, https://yeshotels.in, reached in at most ONE redirect from any other form:
#
#   http://yeshotels.in/x       -> 301 https://yeshotels.in/x          (1 hop)
#   http://www.yeshotels.in/x   -> 301 https://yeshotels.in/x          (1 hop; today: 2 hops would be needed, it keeps www)
#   https://www.yeshotels.in/x  -> 301 https://yeshotels.in/x          (1 hop; today: 200, no redirect)
#   https://yeshotels.in/x      -> 200 (no change)
#
# Where it goes: /etc/nginx/sites-enabled/yeshotels on the VPS (the file is NOT in this repository). Edit only that file;
# dealpost, karikalam.in and suvaialaya share this nginx and must not be touched.
#
# The existing 443 block for yeshotels.in (the one that proxies to 127.0.0.1:3100 with the WebSocket upgrade) stays exactly as it is,
# except that its server_name must list only "yeshotels.in" so www no longer reaches the app.
#
# Paths below are the ones DEPLOYMENT.md documents (/etc/letsencrypt/live/yeshotels.in/). Match them to the real file.

# 1) Plain HTTP for both names: straight to the canonical https address.
server {
    listen 80;
    listen [::]:80;
    server_name yeshotels.in www.yeshotels.in;

    # Keep certificate renewals working. Use the SAME mechanism the current file uses for /.well-known/acme-challenge/
    # (certbot --nginx or webroot). Check with:  certbot renew --dry-run   after the change.
    # location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    return 301 https://yeshotels.in$request_uri;
}

# 2) HTTPS www: redirect to the canonical host. Same certificate (it already covers both names).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.yeshotels.in;

    ssl_certificate     /etc/letsencrypt/live/yeshotels.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yeshotels.in/privkey.pem;
    # include the same TLS options the existing yeshotels block includes (e.g. /etc/letsencrypt/options-ssl-nginx.conf)

    # The site already sends HSTS with includeSubDomains; keep sending it on the www host too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Optional, to make https://www.yeshotels.in/rooms/ ONE hop instead of two (must stay ABOVE the return line; untested):
    # rewrite ^/(.+?)/+$ https://yeshotels.in/$1 permanent;

    return 301 https://yeshotels.in$request_uri;
}

# 3) The existing  server { listen 443 ssl; server_name yeshotels.in; ... proxy_pass http://127.0.0.1:3100; ... }  stays.

# ---------------------------------------------------------------------------------------------------------------
# Rollout (needs approval; all on the server)
#   cp /etc/nginx/sites-enabled/yeshotels /root/yeshotels.nginx.$(date +%F).bak
#   ...edit the file as above...
#   nginx -t && systemctl reload nginx
#   certbot renew --dry-run
#   node seo-agent/scripts/host-audit.mjs        # must show every www / http row ending in 1 hop at https://yeshotels.in
#
# Rollback (30 seconds)
#   cp /root/yeshotels.nginx.<date>.bak /etc/nginx/sites-enabled/yeshotels && nginx -t && systemctl reload nginx
#
# Expected effects to tell staff about
#   - Anyone signed in at www.yeshotels.in is signed out once (cookies belong to one host). yeshotels.in sessions are unaffected.
#   - API clients that call https://www.yeshotels.in/api/... must switch to https://yeshotels.in/api/... (a 301 on POST becomes a GET in most clients).
#     The app has no such clients in this repository; check any external integration (channel manager, payment webhooks) before the change.
# ---------------------------------------------------------------------------------------------------------------
