services:
  yeshotels-db:
    image: mongo:8
    container_name: yeshotels-db
    hostname: yeshotels-db
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - yeshotels-mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch(e) { rs.initiate().ok }'"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - yeshotels-net

  yeshotels-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yeshotels-app
    restart: unless-stopped
    ports:
      # Only nginx (on this server) reaches the app; the public uses https://yeshotels.in
      - "127.0.0.1:3100:3100"
    environment:
      - NODE_ENV=production
      - PORT=3100
      - MONGODB_URI=mongodb://yeshotels-db:27017/yes_hotels?replicaSet=rs0
      - CLIENT_URL=${CLIENT_URL:-http://187.127.217.225:3100}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - UPGRADE_INSECURE_REQUESTS=${UPGRADE_INSECURE_REQUESTS:-false}
      # Owner's master password (hash only; unset = off). See server/src/services/master-password.ts
      - MASTER_PASSWORD_HASH=${MASTER_PASSWORD_HASH:-}
      # Outgoing email (guest sign-in codes, notifications): bookings@yeshotels.in on Google Workspace
      - EMAIL_SERVICE=${EMAIL_SERVICE:-gmail}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
      - BOOKING_ENQUIRY_RECIPIENTS=${BOOKING_ENQUIRY_RECIPIENTS:-}
    volumes:
      - yeshotels-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      yeshotels-db:
        condition: service_healthy
    networks:
      - yeshotels-net

volumes:
  yeshotels-mongo-data:
  yeshotels-uploads:

networks:
  yeshotels-net:
    driver: bridge
