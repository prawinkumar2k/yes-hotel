name: One-time launch data reset

# Runs only when ops/launch-reset.json changes. Waits for the new version to be running,
# backs up the database (stops if the backup is missing or tiny), then runs the reset once per
# runId — a second run with the same runId does nothing. See server/src/scripts/launch-reset.ts.
on:
  push:
    branches:
      - hardening/phase-1
    paths:
      - ops/launch-reset.json

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read request
        id: req
        run: |
          RUN=$(jq -r '.run' ops/launch-reset.json)
          RUN_ID=$(jq -r '.runId' ops/launch-reset.json)
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "runId=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run=$RUN runId=$RUN_ID"
      - name: Back up, then reset (on the server)
        if: steps.req.outputs.run == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.217.225
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            RUN_ID="${{ steps.req.outputs.runId }}"
            echo "Waiting for the new version (with the reset script) to be running..."
            for i in $(seq 1 90); do
              if docker exec yeshotels-app test -f /app/server/src/scripts/launch-reset.ts 2>/dev/null \
                && curl -sf http://127.0.0.1:3100/api/ready > /dev/null; then break; fi
              sleep 10
            done
            docker exec yeshotels-app test -f /app/server/src/scripts/launch-reset.ts

            mkdir -p /opt/yeshotels-backups
            OUT="/opt/yeshotels-backups/yes_hotels-$(date -u +%Y%m%dT%H%M%SZ)-before-$RUN_ID.archive.gz"
            docker exec yeshotels-db mongodump --db yes_hotels --archive --gzip > "$OUT"
            SIZE=$(stat -c %s "$OUT")
            echo "Backup: $OUT ($SIZE bytes)"
            if [ "$SIZE" -lt 20000 ]; then echo "Backup too small — stopping, nothing changed."; exit 1; fi

            echo "--- Dry run"
            docker exec -w /app yeshotels-app npx tsx server/src/scripts/launch-reset.ts --run-id="$RUN_ID"
            echo "--- Apply"
            docker exec -w /app yeshotels-app npx tsx server/src/scripts/launch-reset.ts --run-id="$RUN_ID" --apply
            curl -sf http://127.0.0.1:3100/api/ready && echo " app healthy"
