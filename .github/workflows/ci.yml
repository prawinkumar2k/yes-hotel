name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Tests need a real replica-set MongoDB (booking creation uses multi-document
    # transactions) — a single-node replica set is the smallest configuration
    # that supports that, matching what this project's local dev setup uses.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      # Isolated from any real database — this is the same test-only URI
      # pattern vitest.config.ts enforces locally, pointed at the ephemeral
      # CI service container instead of localhost.
      TEST_MONGODB_URI: mongodb://localhost:27017/yes_hotels_test
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-only-test-secret-value-not-used-anywhere-real

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Initialize MongoDB as a single-node replica set
        run: |
          sudo apt-get update && sudo apt-get install -y mongodb-clients || true
          for i in $(seq 1 30); do
            mongosh --host localhost:27017 --eval "db.adminCommand('ping')" && break
            sleep 1
          done
          mongosh --host localhost:27017 --eval "rs.initiate()"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency security audit (production dependencies only)
        run: pnpm audit --prod
        continue-on-error: true # advisory — a new CVE in a transitive dep shouldn't block every PR; reviewed manually

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & integration tests
        run: pnpm test

      - name: Build (client + server)
        run: pnpm build

      - name: Verify the production artifact actually boots
        # A successful `pnpm build` only proves the bundler didn't error — it
        # does NOT prove the resulting server can start. This project was
        # burned by exactly that gap once already (see README "Deployment" —
        # missing runtime dependencies and an Express 5 routing bug were both
        # invisible to `pnpm build` and only found by actually booting the
        # compiled artifact). This step is that same check, automated.
        run: |
          node dist/server/node-build.mjs &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080/api/health && break
            sleep 1
          done
          curl -sf http://localhost:8080/api/health || (echo "Server failed to become healthy" && exit 1)
          curl -sf http://localhost:8080/api/ready || (echo "Server failed readiness check" && exit 1)
          kill $SERVER_PID
        env:
          PORT: 8080
          NODE_ENV: production
          MONGODB_URI: mongodb://localhost:27017/yes_hotels_ci_boot_check
          CLIENT_URL: http://localhost:8080
          JWT_ACCESS_SECRET: ci-only-test-secret-value-not-used-anywhere-real

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017/yes_hotels_e2e
      NODE_ENV: development
      JWT_ACCESS_SECRET: ci-only-test-secret-value-not-used-anywhere-real
      CLIENT_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Initialize MongoDB as a single-node replica set
        run: |
          for i in $(seq 1 30); do
            mongosh --host localhost:27017 --eval "db.adminCommand('ping')" && break
            sleep 1
          done
          mongosh --host localhost:27017 --eval "rs.initiate()"
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Seed demo data
        run: pnpm seed
      - name: Start dev server
        run: pnpm dev &
      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health && break
            sleep 1
          done
      - name: Run Playwright E2E + accessibility suite
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
