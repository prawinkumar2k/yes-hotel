name: Continuous Deployment to Hostinger VPS

on:
  push:
    branches:
      - main
      - hardening/phase-1

permissions:
  contents: read
  actions: read

jobs:
  # Deploy only what CI has passed. If CI fails (or never finishes) for this exact commit, nothing is deployed
  # and the site keeps running the last good version.
  wait-for-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 90); do
            row=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$SHA" --limit 1 --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' 2>/dev/null || true)
            echo "CI for $SHA: ${row:-not started yet}"
            case "$row" in
              "completed success") echo "CI passed - deploying"; exit 0 ;;
              completed*) echo "CI did not pass - NOT deploying"; exit 1 ;;
            esac
            sleep 15
          done
          echo "CI did not finish in time - NOT deploying"; exit 1

  deploy:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.217.225
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Deployment started on Hostinger VPS..."
            cd /opt/yeshotels
            
            # Fetch and align with latest push
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            
            # Rebuild and restart app container (zero DB downtime)
            echo "🐳 Rebuilding and updating Docker containers..."
            docker compose up -d --build --no-deps yeshotels-app
            
            # Verify app status
            echo "🔍 Verifying app readiness..."
            for i in $(seq 1 30); do
              if curl -s -f http://127.0.0.1:3100/api/ready > /dev/null; then
                echo "✅ App is healthy and responding!"
                exit 0
              fi
              echo "Waiting for app to start ($i/30)..."
              sleep 2
            done
            
            echo "❌ Application readiness check timed out!"
            exit 1
