<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YES HOTELS — Say Yes to Time Well Spent</title>
    <meta
      name="description"
      content="YES HOTELS is a premium boutique hospitality brand. Discover thoughtfully designed rooms, warm hospitality and effortless booking."
    />
    <!-- Add <link rel="canonical" href="https://<production-domain>/..." />
         per page once a production domain is assigned — Vite's HTML asset
         processor breaks on a relative "/" href here, and canonical URLs
         must be absolute per spec anyway. -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YES Hotels" />
    <meta property="og:title" content="YES HOTELS — Say Yes to Time Well Spent" />
    <meta
      property="og:description"
      content="YES HOTELS is a premium boutique hospitality brand. Discover thoughtfully designed rooms, warm hospitality and effortless booking."
    />
    <!-- TODO: replace with a real production hero photo before launch — a
         placeholder SVG will not render correctly in most OG/Twitter unfurls. -->
    <meta property="og:image" content="/placeholder.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YES HOTELS — Say Yes to Time Well Spent" />
    <meta
      name="twitter:description"
      content="YES HOTELS is a premium boutique hospitality brand. Discover thoughtfully designed rooms, warm hospitality and effortless booking."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
